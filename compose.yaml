name: carthound

x-tooling: &tooling
  build:
    context: .
    secrets:
      - github_token
  image: carthound-db-tooling

services:
  postgres:
    image: postgres:18.6-bookworm
    profiles: [local-db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CARTHOUND_POSTGRES_USER:-carthound}
      POSTGRES_PASSWORD: ${CARTHOUND_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${CARTHOUND_POSTGRES_DB:-carthound}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --data-checksums
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  migrate:
    <<: *tooling
    profiles: [tools]
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    command: [npm, run, persistence:migrate]

  postgres-test:
    image: postgres:18.6-bookworm
    profiles: [test]
    environment:
      POSTGRES_USER: carthound_test
      POSTGRES_DB: carthound_test
      POSTGRES_PASSWORD: ${CARTHOUND_TEST_POSTGRES_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --data-checksums
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, carthound_test, -d, carthound_test]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  persistence-test:
    <<: *tooling
    profiles: [test]
    environment:
      CARTHOUND_TEST_DATABASE_URL: ${CARTHOUND_TEST_DATABASE_URL:-}
    command: [npm, run, persistence:test:postgres]

volumes:
  postgres_data: {}

secrets:
  github_token:
    environment: GITHUB_TOKEN
